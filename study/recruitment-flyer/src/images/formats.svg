<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Generic icons: 2D printed sheet, 3D model on a tablet (iPad), 3D printed model, narrated video (drawn for this flyer, CC0). -->
  <defs>
    <path id="t" d="M -14,0 C -16,-8 -16,-17 -12,-21 Q -6,-25 -2,-21 Q 0,-23 2,-21 Q 6,-25 12,-21 C 16,-17 16,-8 14,0
      C 13,10 12,20 10,27 Q 8,30 6,27 C 5,20 3,12 1,7 L -1,7 C -3,12 -5,20 -6,27 Q -8,30 -10,27 C -12,20 -13,10 -14,0 Z"/>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#e6eef3"/><stop offset="1" stop-color="#aebcc6"/>
    </linearGradient>
  </defs>
  <!-- 1: 2D sheet -->
  <g transform="translate(60,50)">
    <path d="M -28,-42 L 18,-42 L 30,-30 L 30,42 L -28,42 Z" fill="#fff" stroke="#23617f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 18,-42 L 18,-30 L 30,-30" fill="none" stroke="#23617f" stroke-width="3" stroke-linejoin="round"/>
    <use href="#t" transform="translate(0,-6) scale(0.9)" fill="none" stroke="#231f20" stroke-width="2.2"/>
    <g stroke="#9fb0bd" stroke-width="3" stroke-linecap="round"><line x1="-18" y1="26" x2="20" y2="26"/><line x1="-18" y1="34" x2="10" y2="34"/></g>
  </g>
  
  <!-- 2: tablet with 3D model -->
  <g transform="translate(180,50)">
    <rect x="-31" y="-42" width="62" height="84" rx="7" fill="#fff" stroke="#23617f" stroke-width="3"/>
    <circle cx="0" cy="-36" r="1.8" fill="#23617f"/>
    <use href="#t" transform="translate(0,-4) scale(0.95)" fill="url(#shade)" stroke="#56636f" stroke-width="1.5"/>
    <path d="M -15,26 A 15 5 0 1 0 15,26" fill="none" stroke="#23617f" stroke-width="2"/>
    <path d="M 15,26 l -5,-3 m 5,3 l -5,3" fill="none" stroke="#23617f" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- 3: 3D printed model on a base -->
  <g transform="translate(300,46)">
    <use href="#t" transform="translate(0,-4) scale(1.35)" fill="url(#shade)" stroke="#56636f" stroke-width="1.3"/>
    <path d="M -34,38 L -24,30 L 24,30 L 34,38 Z" fill="#cfe0ea" stroke="#23617f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-34" y="38" width="68" height="8" fill="#23617f"/>
  </g>
  <!-- 4: narrated video -->
  <g transform="translate(420,50)">
    <rect x="-34" y="-28" width="68" height="46" rx="6" fill="#fff" stroke="#23617f" stroke-width="3"/>
    <path d="M -7,-15 L 11,-5 L -7,5 Z" fill="#23617f"/>
    <line x1="-12" y1="30" x2="12" y2="30" stroke="#23617f" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="30" stroke="#23617f" stroke-width="3"/>
    <path d="M 40,-14 q 6,8 0,16 M 46,-20 q 11,14 0,28" fill="none" stroke="#9fb0bd" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
