name: Check pages and patient text

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install patient-education-toolkit
        run: |
          pip install "setuptools<70" wheel
          pip install --no-build-isolation unidic-lite fugashi
          pip install git+https://github.com/CBCT-2026/patient-education-toolkit
      - name: Pages match the content files
        run: |
          python3 tools/build.py
          git diff --exit-code -- index.html en ja video || (echo "Pages are out of date: run python3 tools/build.py and commit the result." && exit 1)
      - name: Reading level, kanji, wording and English/Japanese match
        run: pitk check
